name: 收集访问统计

# GitHub 只给仓库主人看最近 14 天的流量，而且接口要 token。
# 这里每天跑两次，把结果写成 data/traffic.json 提交上去，家长页就能直接看。
on:
  schedule:
    - cron: '40 1,13 * * *'   # UTC 01:40 / 13:40 = 北京时间 09:40 / 21:40
  workflow_dispatch:          # 也可以在网页上手动点一次

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取 GitHub 流量数据
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 tools/fetch_traffic.py

      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/traffic.json data/traffic_log.json
            git commit -m "访问统计更新 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "数据没变化，不用提交"
          fi
