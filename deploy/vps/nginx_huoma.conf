# Nginx 反代配置：用户访问 80/443 → 转发给本地 8000 的 gunicorn
# 放到 /etc/nginx/sites-available/huoma，再 ln -s 到 sites-enabled/
server {
    listen 80;
    server_name huoma.你的域名.com;   # 改成你的域名

    # 群二维码图片让 nginx 直接发，比走 Python 快
    location /static/qrcodes/ {
        alias /opt/huoma/static/qrcodes/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
