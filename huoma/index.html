<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码进群，帮孩子学习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #07c160 0%, #0a9d4d 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; width: 100%; max-width: 380px; border-radius: 20px;
    padding: 32px 24px 28px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.5; }
  .qr-wrap {
    width: 260px; height: 260px; max-width: 100%; margin: 0 auto 14px; border-radius: 16px;
    border: 1px solid #eee; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #fff;
  }
  .qr-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .qr-tip { font-size: 14px; color: #07c160; margin-bottom: 10px; font-weight: 600; }
  .note { font-size: 12px; color: #999; line-height: 1.6; margin-top: 16px; }
  .footer { font-size: 11px; color: #bbb; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">扫码进群，帮孩子学习</div>
    <div class="subtitle">长按识别下方二维码，加入我们的微信群</div>
    <div class="qr-wrap">
      <img alt="群二维码" src="qr.png">
    </div>
    <div class="qr-tip">长按识别二维码，加入群聊</div>
    <div class="note">若提示二维码无效，请隔天再试，群主会定期更新</div>
    <div class="footer">欢迎转发给需要的朋友</div>
  </div>
<script>
// 本页与学习应用共用同一个 GitHub Pages 站点。学习应用的 Service Worker 是
// 「缓存优先」：手机把第一次看到的页面存起来、后台再悄悄更新，导致反复打开过
// 的手机一直显示旧文案 / 旧群码。这里让本页自己校正：
//   1) 用 HEAD 请求读服务器上本页的 Last-Modified（该 Service Worker 只拦截 GET，
//      HEAD 直接走网络，能读到真实版本）
//   2) 版本与上次记录不同 → 只删掉本页自己那一条缓存记录，再刷新一次
//   3) 同时监听 Service Worker 的「有新版本」消息作为兜底
// 全程不注册、不注销、不修改任何 Service Worker；只删本页 URL 对应的缓存键，
// 学习应用的 index.html / js / css / data 等文件与缓存一律不碰。
(function () {
  var SEEN = 'huoma-seen-ver';
  var DONE = 'huoma-refreshed-for';
  var pageUrl = new URL(location.pathname, location.origin).href;
  var pageKeys = [pageUrl, pageUrl + 'index.html'];

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

  function probe() {
    return fetch(pageUrl, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.headers.get('Last-Modified') || ''; })
      .catch(function () { return ''; });
  }

  function refresh(ver) {
    if (!ver || sget(DONE) === ver) return;   // 同一版本最多刷一次，防死循环
    sset(DONE, ver);
    set(SEEN, ver);
    var wipe = Promise.resolve();
    if (window.caches && caches.keys && caches.open) {
      wipe = caches.keys().then(function (names) {
        return Promise.all(names.map(function (n) {
          return caches.open(n).then(function (c) {
            return Promise.all(pageKeys.map(function (k) {
              return c.delete(k, { ignoreSearch: true }).catch(function () {});
            }));
          }).catch(function () {});
        }));
      }).catch(function () {});
    }
    wipe.then(function () { location.reload(); });
  }

  // 服务器版本变了就校正一次
  probe().then(function (ver) {
    if (!ver) return;                          // 网络异常：什么都不做，页面照常显示
    var seen = get(SEEN);
    if (!seen) { set(SEEN, ver); return; }     // 首次访问：记下版本即可
    if (seen !== ver) refresh(ver);
  });

  // 兜底：Service Worker 发现内容变化时发的消息
  if (navigator.serviceWorker && navigator.serviceWorker.addEventListener) {
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'updated') {
        probe().then(function (ver) { if (ver) refresh(ver); });
      }
    });
  }
})();
</script>
</body>
</html>
